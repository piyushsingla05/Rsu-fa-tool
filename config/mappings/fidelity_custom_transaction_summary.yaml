id: fidelity_custom_transaction_summary
label: Fidelity NetBenefits - custom transaction summary
broker: FIDELITY
document_type: TRANSACTION_SUMMARY

match:
  file_kind: [pdf]
  all_text: ["custom transaction summary"]
  any_text: ["dividend income", "stock sales", "nonresident alien withholding",
             "fidelity stock plan services"]
  filename_hint: ["fidelity"]
  min_score: 0.6

layout:
  kind: pdf_sections
  sections:
    # Gross dividend income. Small monthly amounts are cash-reserve earnings,
    # which Fidelity states may be included in this section.
    - name: dividends
      role: dividends
      start_after: "Dividend income"
      end_before: "Interest income"
      row_regex: '^\s*\$(?P<amount>[\d,]+\.\d{2})\s+USD\s+(?P<date>[A-Z][a-z]{2}-\d{2}-\d{4})\s+Dividend / Interest'
      action_map:
        "": gross
      default_action: gross

    # Withholding is reported in its own section with its own dates, so it
    # cannot be paired line-by-line the way Schwab's can. Amounts are negative
    # for tax withheld and positive for a reversal, so the sign is inverted.
    - name: nra_withholding
      role: withholding
      start_after: "Nonresident alien withholding"
      row_regex: '^\s*(?P<amount>-?\$[\d,]+\.\d{2})\s+USD\s+(?P<date>[A-Z][a-z]{2}-\d{2}-\d{4})\s+Other'
      sign: invert

    # Date sold, date acquired, quantity, cost basis and proceeds - a complete
    # closed-lot record, the same shape Schwab's year-end summary provides.
    - name: stock_sales
      role: closed_lot_gains
      start_after: "Stock sales"
      row_regex: '^\s*(?P<sold>[A-Z][a-z]{2}-\d{2}-\d{4})\s+(?P<acquired>[A-Z][a-z]{2}-\d{2}-\d{4})\s+(?P<qty>[\d,]+\.\d{1,4})\s+\$(?P<cost>[\d,]+\.\d{2})\s+\$(?P<proceeds>[\d,]+\.\d{2})'

identity:
  account_regex: '\*{3,}(?P<account>\d{4})'

rules:
  plan_type: RSU
  symbol_from_text:
    broadcom: AVGO
    microsoft: MSFT
